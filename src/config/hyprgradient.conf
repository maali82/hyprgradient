# hyprgradient config

[settings]
log_level = "info"

# resolution (squared) of the framebuffer
# default 256 is nice enough for 1920x1080 screens thanks to bilinear filtering
# be aware that using larger resolutions eats more GPU compute and memory
texture_resolution = 256

# seconds until cycle to the next available gradient
cycle_interval = 600

# todo: come up with good naming convention for all the same, every monitor unique, etc...
monitor = "all"

# randomize the gradients, otherwise sequential as listed
random = false

# --- Gradient profiles -----------------------------------------------
# Define as many as you like; only the one(s) with active = true are shown
# Each gradient is a list of colors:
# position is 0-100 (percent along the gradient for the color)
# color is [R, G, B]. 0-255 each.

[[gradients]]
name = "midnight"
active = true
type = "linear"
direction = 45

  [[gradients.stops]]
  position = 0
  color = [15, 20, 40]

  [[gradients.stops]]
  position = 50
  color = [80, 20, 110]

  [[gradients.stops]]
  position = 100
  color = [130, 40, 170]

[[gradients]]
name = "sunset"
active = true
type = "linear"
direction = 0

  [[gradients.stops]]
  position = 0
  color = [255, 94, 77]

  [[gradients.stops]]
  position = 100
  color = [64, 12, 90]

[[gradients]]
name = "forest"
active = true
type = "linear"
direction = 0

  [[gradients.stops]]
  position = 0
  color = [10, 40, 20]

  [[gradients.stops]]
  position = 60
  color = [40, 100, 45]

  [[gradients.stops]]
  position = 100
  color = [90, 150, 60]
