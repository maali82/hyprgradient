[package]
name = "hyprgradient"
version = "0.1.1"
edition = "2021"
homepage = "https://github.com/maali82/hyprgradient"
repository = "https://github.com/maali82/hyprgradient"

[features]
testing = []

[dependencies]
wayland-client = "0"
wayland-egl = "0"
smithay-client-toolkit = { version = "0", features = ["calloop"] }
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
gl = "0"
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
anyhow = "1"
env_logger = "0"
log = "0"

[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Maali"
copyright = "2026, Maali"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """A Wayland wallpaper generator that renders GPU-accelerated gradient backgrounds."""
assets = [ ["target/release/hyprgradient", "usr/bin/hyprgradient", "755"], ]
